[project]
name = "code-mortis"
version = "0.1.0"
description = "Self-hosted GitHub pull request reviews and security scans with Mortis Engine"
requires-python = ">=3.13,<3.15"
dependencies = [
  "mortis-engine==0.1.4",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.15,<2",
  "celery[redis]>=5.6,<6",
  "httpx>=0.28,<1",
  "botocore>=1.39,<2",
  "jsonschema>=4.23,<5",
  "cryptography>=44",
  "pyjwt[crypto]>=2.10,<3",
  "authlib>=1.6,<2",
  "sentry-sdk[celery]>=2.72,<3",
  "mcp==2.3.0",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", {include-group = "code-graph"}]
code-graph = [
  "uvicorn>=0.34,<1", "pydantic>=2.8,<3",
  "tree-sitter==0.25.2", "tree-sitter-python==0.25.0",
  "tree-sitter-javascript==0.25.0", "tree-sitter-typescript==0.23.2",
  "tree-sitter-go==0.25.0", "tree-sitter-rust==0.24.2",
  "tree-sitter-java==0.23.5", "tree-sitter-c==0.24.2",
  "tree-sitter-cpp==0.23.4", "tree-sitter-c-sharp==0.23.5",
  "tree-sitter-php==0.24.1", "tree-sitter-ruby==0.23.1",
  "tree-sitter-bash==0.25.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
