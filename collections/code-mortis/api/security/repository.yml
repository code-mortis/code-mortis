name: Repository
method: GET
url: $base_url/api/v1/security/repositories/:repository_id
timeout: 30000
tags:
  - read
followRedirects: false
maxRedirects: 5
path_params:
  - name: repository_id
    value: $repository_id
body_type: none
assert:
  - expression: status
    operator: equals
    value: 200
auth:
  type: inherit
