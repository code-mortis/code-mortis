name: Edit Connection
method: PUT
url: $base_url/api/v1/connections/:connection_id
timeout: 30000
tags:
  - write
followRedirects: false
maxRedirects: 5
headers:
  Content-Type: application/json
path_params:
  - name: connection_id
    value: $connection_id
body: |-
  {
    "kind": "api",
    "name": "$connection_name",
    "provider": "openai",
    "protocol": "openai-responses",
    "base_url": "$provider_base_url",
    "model": "$model"
  }
body_type: json
assert:
  - expression: status
    operator: equals
    value: 200
