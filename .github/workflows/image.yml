name: Verify image
# shortcut: GitHub filters inspect at most 3,000 files; dispatch manually for larger diffs.
on:
  push:
    branches: [main]
    paths: &paths
      - '.github/workflows/image.yml'
      - '.github/ci-filters.test.ts'
      - 'docker/Dockerfile'
      - 'docker/Dockerfile.dockerignore'
      - 'docker/compose.api-smoke.yaml'
      - 'docker/sync-worker.sh'
      - 'compose*.yaml'
      - 'scripts/check_code_graph.py'
      - '.dockerignore'
      - 'backend/**'
      - 'frontend/**'
      - 'collections/code-mortis-ci/**'
      - 'LICENSE'
      - 'LICENSES/**'
      - 'THIRD_PARTY_NOTICES.md'
  pull_request:
    branches: [main]
    paths: *paths
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  image:
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: docker/compose.api-smoke.yaml
    steps:
      - uses: actions/checkout@v4
      - run: python3 -B scripts/check_code_graph.py
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: code-mortis:test
          build-args: DOCKERHUB_REGISTRY=mirror.gcr.io
          cache-from: type=gha,scope=image
          cache-to: type=gha,scope=image,mode=max
      - run: >-
          docker run --rm --network none --read-only
          --tmpfs /tmp:mode=1777,size=256m
          code-mortis:test python tests/mortis_container_smoke.py
      - run: >-
          docker run --rm --network none --read-only
          --tmpfs /tmp:mode=1777,size=512m
          code-mortis:test python tests/security_scanner_smoke.py
      - run: >-
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges
          --tmpfs /tmp:mode=1777,size=128m code-mortis:test python tests/code_graph_container.py
      - uses: noodle-rest/setup-noodle@dc79d16dbbd50a01e63f11bcca15c9398fe70915 # v1.0.1
        with:
          version: v1.0.0
      - name: Start API and apply migrations
        id: start-api
        env:
          CM_SMOKE_ENV_FILE: ${{ runner.temp }}/code-mortis-api-smoke.env
        run: |
          python3 backend/code_mortis/manage.py init-env --owner ci --output "$CM_SMOKE_ENV_FILE"
          docker compose --env-file "$CM_SMOKE_ENV_FILE" up --wait --wait-timeout 120 api
      - name: Run public API smoke tests
        id: api-smoke
        run: >-
          noodle collection run collections/code-mortis-ci --env ci
          --reporter junit --output "$RUNNER_TEMP/api-smoke.xml"
      - name: Show API smoke stack logs on failure
        if: ${{ failure() && (steps.start-api.outcome == 'failure' || steps.api-smoke.outcome == 'failure') }}
        env:
          CM_SMOKE_ENV_FILE: ${{ runner.temp }}/code-mortis-api-smoke.env
        run: docker compose --env-file "$CM_SMOKE_ENV_FILE" logs --no-color
      - name: Upload API smoke report
        if: ${{ !cancelled() && (steps.api-smoke.outcome == 'success' || steps.api-smoke.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: api-smoke
          path: ${{ runner.temp }}/api-smoke.xml
          if-no-files-found: error
