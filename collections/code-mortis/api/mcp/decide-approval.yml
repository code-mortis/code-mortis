name: Decide Approval
method: POST
url: $base_url/api/v1/mcp/approvals/:approval_id
timeout: 30000
tags:
  - write
followRedirects: false
maxRedirects: 5
headers:
  Content-Type: application/json
path_params:
  - name: approval_id
    value: $approval_id
body: |-
  {
    "approve": false
  }
body_type: json
assert:
  - expression: status
    operator: equals
    value: 200
