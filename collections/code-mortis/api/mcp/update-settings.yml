name: Update Settings
method: PUT
url: $base_url/api/v1/mcp/settings
timeout: 30000
tags:
  - write
followRedirects: false
maxRedirects: 5
headers:
  Content-Type: application/json
body: |-
  {
    "reviews_enabled": false,
    "security_enabled": false,
    "management_enabled": false,
    "allowed_client_domains": []
  }
body_type: json
assert:
  - expression: status
    operator: equals
    value: 200
