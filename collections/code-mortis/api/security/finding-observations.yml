name: Finding Observations
method: GET
url: $base_url/api/v1/security/findings/:finding_id/observations
timeout: 30000
tags:
  - read
followRedirects: false
maxRedirects: 5
params:
  - name: page
    value: '1'
    enabled: false
path_params:
  - name: finding_id
    value: $security_finding_id
body_type: none
assert:
  - expression: status
    operator: equals
    value: 200
