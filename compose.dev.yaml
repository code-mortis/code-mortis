name: code-mortis-dev

x-app: &app
  image: code-mortis-dev:0.2.0
  build:
    context: .
    dockerfile: docker/Dockerfile
    args:
      CM_SENTRY_FRONTEND_DSN: ${CM_SENTRY_FRONTEND_DSN:-}
      CM_SENTRY_ENVIRONMENT: ${CM_SENTRY_ENVIRONMENT:-development}
      CM_SENTRY_RELEASE: ${CM_SENTRY_RELEASE:-}
  env_file: .env.dev
  environment: &environment
    CM_DATABASE_URL: postgresql+psycopg://mortis:${POSTGRES_PASSWORD:?Use --env-file .env.dev}@postgres:5432/mortis_dev
    CM_REDIS_URL: redis://redis:6379/0
    CM_PUBLIC_URL: http://localhost:5173
    CM_COOKIE_SECURE: "false"
    CM_SENTRY_DSN: ${CM_SENTRY_DSN:-}
    CM_SENTRY_FRONTEND_DSN: ${CM_SENTRY_FRONTEND_DSN:-}
    CM_SENTRY_ENVIRONMENT: ${CM_SENTRY_ENVIRONMENT:-development}
    CM_SENTRY_RELEASE: ${CM_SENTRY_RELEASE:-}
  volumes:
    - ./backend/code_mortis:/app/backend/code_mortis:ro
    - ./backend/migrations:/app/backend/migrations:ro
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  init: true
  tmpfs: ["/tmp:mode=1777,size=2g"]
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mortis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Use --env-file .env.dev}
      POSTGRES_DB: mortis_dev
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U mortis -d mortis_dev"]
      interval: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, "yes", --maxmemory-policy, noeviction]
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      retries: 20
  migrate:
    <<: *app
    command: [alembic, upgrade, head]
  api:
    <<: *app
    volumes:
      - ./backend/code_mortis:/app/backend/code_mortis:ro
      - ./backend/migrations:/app/backend/migrations:ro
      - code-graph-data:/var/lib/code-mortis/code-graph:ro
    command: [uvicorn, code_mortis.main:app, --host, "0.0.0.0", --port, "8080", --reload, --reload-dir, /app/backend/code_mortis, --no-access-log]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8080/health/ready',timeout=5)"]
      interval: 5s
      retries: 20
  frontend:
    image: oven/bun:1.4.2
    working_dir: /src/frontend
    command: [sh, -c, "bun install --frozen-lockfile && bun run dev --host 0.0.0.0"]
    environment:
      CM_DEV_API_URL: http://api:8080
      VITE_SENTRY_DSN: ${CM_SENTRY_FRONTEND_DSN:-}
      VITE_SENTRY_ENVIRONMENT: ${CM_SENTRY_ENVIRONMENT:-development}
      VITE_SENTRY_RELEASE: ${CM_SENTRY_RELEASE:-}
    volumes:
      - ./frontend:/src/frontend
      - frontend-modules:/src/frontend/node_modules
    ports: ["127.0.0.1:5173:5173"]
    depends_on:
      api: {condition: service_healthy}
  review-worker:
    <<: *app
    command: [celery, -A, code_mortis.jobs:celery, worker, -Q, reviews, --concurrency=1, --loglevel=INFO, --hostname=reviews@%h]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  security-worker:
    <<: *app
    environment:
      <<: *environment
      CM_TRIVY_CACHE_DIR: /var/cache/mortis-trivy
    volumes:
      - ./backend/code_mortis:/app/backend/code_mortis:ro
      - ./backend/migrations:/app/backend/migrations:ro
      - trivy-cache:/var/cache/mortis-trivy
    command: [celery, -A, code_mortis.jobs:celery, worker, -Q, security, --concurrency=1, --loglevel=INFO, --hostname=security@%h]
    mem_limit: 2g
    cpus: 2
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  verification-worker:
    <<: *app
    command: [celery, -A, code_mortis.jobs:celery, worker, -Q, verification, --concurrency=1, --loglevel=INFO, --hostname=verification@%h]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  summary-worker:
    <<: *app
    command: [celery, -A, code_mortis.jobs:celery, worker, -Q, summaries, --concurrency=1, --loglevel=INFO, --hostname=summaries@%h]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  sync-worker:
    <<: *app
    command: [/usr/local/bin/code-mortis-sync]
    stop_grace_period: 30s
    volumes:
      - ./backend/code_mortis:/app/backend/code_mortis:ro
      - ./backend/migrations:/app/backend/migrations:ro
      - code-graph-data:/var/lib/code-mortis/code-graph
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  scheduler:
    <<: *app
    command: [celery, -A, code_mortis.jobs:celery, beat, --loglevel=INFO, --schedule=/tmp/celerybeat-schedule]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  relay:
    image: code-mortis-relay:5.0.0
    build: {context: ., dockerfile: docker/Dockerfile, target: relay}
    profiles: [webhooks]
    environment:
      CM_WEBHOOK_URL: ${CM_WEBHOOK_URL:-}
    depends_on:
      api: {condition: service_healthy}

volumes:
  postgres-data:
  redis-data:
  trivy-cache:
  code-graph-data:
  frontend-modules:
