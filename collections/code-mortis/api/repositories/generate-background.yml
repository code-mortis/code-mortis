name: Generate Background
method: POST
url: $base_url/api/v1/repositories/:repository_id/background
timeout: 30000
tags:
  - write
followRedirects: false
maxRedirects: 5
headers:
  Content-Type: application/json
path_params:
  - name: repository_id
    value: $repository_id
body: |-
  {
    "connection_id": "$connection_id"
  }
body_type: json
assert:
  - expression: status
    operator: equals
    value: 202
