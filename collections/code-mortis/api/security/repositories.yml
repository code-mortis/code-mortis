name: Repositories
method: GET
url: $base_url/api/v1/security/repositories
timeout: 30000
tags:
  - read
  - smoke
followRedirects: false
maxRedirects: 5
params:
  - name: page
    value: '1'
    enabled: false
  - name: ordering
    value: -updated_at
    enabled: false
body_type: none
assert:
  - expression: status
    operator: equals
    value: 200
