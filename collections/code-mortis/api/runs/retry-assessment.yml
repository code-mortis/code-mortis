name: Retry Assessment
method: POST
url: $base_url/api/v1/runs/:run_id/candidates/:candidate_id/retry
timeout: 30000
tags:
  - write
followRedirects: false
maxRedirects: 5
path_params:
  - name: run_id
    value: $run_id
  - name: candidate_id
    value: $candidate_id
body_type: none
assert:
  - expression: status
    operator: equals
    value: 202
auth:
  type: inherit
