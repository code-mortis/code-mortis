name: Verify image
# shortcut: GitHub filters inspect at most 3,000 files; dispatch manually for larger diffs.
on:
  push:
    branches: [main]
    paths: &paths
      - '.github/workflows/image.yml'
      - '.github/ci-filters.test.ts'
      - 'Dockerfile'
      - 'Dockerfile.dockerignore'
      - '.dockerignore'
      - 'backend/**'
      - 'frontend/**'
      - 'build/ocr/**'
      - 'LICENSE'
      - 'LICENSES/**'
      - 'THIRD_PARTY_NOTICES.md'
  pull_request:
    branches: [main]
    paths: *paths
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: code-mortis:test
          build-args: DOCKERHUB_REGISTRY=mirror.gcr.io
          cache-from: type=gha,scope=image
          # Include the OCR build stage, not just the final runtime layers.
          cache-to: type=gha,scope=image,mode=max
      - run: >-
          docker run --rm --network none --read-only
          --tmpfs /tmp:mode=1777,size=256m
          --tmpfs /home/mortis/.opencodereview:uid=10001,gid=10001,mode=0700,size=32m
          code-mortis:test python tests/ocr_container_smoke.py
      - run: >-
          docker run --rm --network none --read-only
          --tmpfs /tmp:mode=1777,size=512m
          code-mortis:test python tests/security_scanner_smoke.py
