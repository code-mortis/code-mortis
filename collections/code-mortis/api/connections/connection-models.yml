name: Connection Models
method: GET
url: $base_url/api/v1/connections/:connection_id/models
timeout: 30000
tags:
  - read
followRedirects: false
maxRedirects: 5
path_params:
  - name: connection_id
    value: $connection_id
body_type: none
assert:
  - expression: status
    operator: equals
    value: 200
