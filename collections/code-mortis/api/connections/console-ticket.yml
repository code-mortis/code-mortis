name: Console Ticket
method: POST
url: $base_url/api/v1/connections/:identity/console-ticket
timeout: 30000
tags:
  - write
followRedirects: false
maxRedirects: 5
path_params:
  - name: identity
    value: $connection_id
body_type: none
assert:
  - expression: status
    operator: equals
    value: 200
