x-worker-health: &worker-health
  interval: 60s
  timeout: 15s
  retries: 3
  start_period: 30s

services:
  api:
    image: &coolify-app codemortis/code-mortis:0.1.4
    # Compose 5.1.3 needs the build reset on each service.
    build: !reset null
    ports: !reset []
    labels:
      - traefik.enable=true
      - traefik.docker.network=${COOLIFY_RESOURCE_UUID}
      - traefik.http.routers.code-mortis.rule=Host(`${CM_PUBLIC_HOST}`)
      - traefik.http.routers.code-mortis.entrypoints=https
      - traefik.http.routers.code-mortis.tls=true
      - traefik.http.routers.code-mortis.tls.certresolver=letsencrypt
      - traefik.http.routers.code-mortis.service=code-mortis
      - traefik.http.services.code-mortis.loadbalancer.server.port=8080
  migrate:
    image: *coolify-app
    build: !reset null
  review-worker:
    image: *coolify-app
    build: !reset null
    healthcheck:
      <<: *worker-health
      test: [CMD-SHELL, 'CELERY_BROKER_URL="$$CM_REDIS_URL" celery inspect --timeout=5 --destination "reviews@$$HOSTNAME" ping']
  security-worker:
    image: *coolify-app
    build: !reset null
    healthcheck:
      <<: *worker-health
      test: [CMD-SHELL, 'CELERY_BROKER_URL="$$CM_REDIS_URL" celery inspect --timeout=5 --destination "security@$$HOSTNAME" ping']
  verification-worker:
    image: *coolify-app
    build: !reset null
    healthcheck:
      <<: *worker-health
      test: [CMD-SHELL, 'CELERY_BROKER_URL="$$CM_REDIS_URL" celery inspect --timeout=5 --destination "verification@$$HOSTNAME" ping']
  summary-worker:
    image: *coolify-app
    build: !reset null
    healthcheck:
      <<: *worker-health
      test: [CMD-SHELL, 'CELERY_BROKER_URL="$$CM_REDIS_URL" celery inspect --timeout=5 --destination "summaries@$$HOSTNAME" ping']
  sync-worker:
    image: *coolify-app
    build: !reset null
    healthcheck:
      <<: *worker-health
      test:
        - CMD-SHELL
        - >-
          export CELERY_BROKER_URL="$$CM_REDIS_URL";
          celery inspect --timeout=5 --destination "sync@$$HOSTNAME" ping &&
          celery inspect --timeout=5 --destination "graph@$$HOSTNAME" ping
  scheduler:
    image: *coolify-app
    build: !reset null
    healthcheck:
      <<: *worker-health
      test:
        - CMD
        - python
        - -c
        - |
          import os
          import sys
          import time
          from contextlib import suppress
          from redis import Redis

          schedule = sys.argv[1]
          last_sync = os.path.getmtime(schedule)
          # SQLite can flush Beat's updates to the WAL between checkpoints.
          with suppress(FileNotFoundError):
              last_sync = max(last_sync, os.path.getmtime(schedule + "-wal"))
          if time.time() - last_sync >= 360:
              raise SystemExit("Celery Beat schedule is stale")
          Redis.from_url(os.environ["CM_REDIS_URL"], socket_timeout=3, socket_connect_timeout=3).ping()
        - /tmp/celerybeat-schedule

networks:
  default:
    name: ${COOLIFY_RESOURCE_UUID}
    external: true
