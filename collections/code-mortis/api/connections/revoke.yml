name: Revoke
method: DELETE
url: $base_url/api/v1/connections/:identity/grants/:repository_id
timeout: 30000
tags:
  - write
followRedirects: false
maxRedirects: 5
path_params:
  - name: identity
    value: $connection_id
  - name: repository_id
    value: $repository_id
body_type: none
assert:
  - expression: status
    operator: equals
    value: 200
