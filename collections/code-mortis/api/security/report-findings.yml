name: Report Findings
method: GET
url: $base_url/api/v1/security/scans/:scan_id/report/findings
timeout: 30000
tags:
  - read
followRedirects: false
maxRedirects: 5
params:
  - name: page
    value: '1'
    enabled: false
  - name: ordering
    value: -severity
    enabled: false
path_params:
  - name: scan_id
    value: $scan_id
body_type: none
assert:
  - expression: status
    operator: equals
    value: 200
auth:
  type: inherit
