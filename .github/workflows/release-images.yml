name: Release Docker image
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
env:
  IMAGE: docker.io/${{ vars.DOCKERHUB_NAMESPACE || 'code-mortis' }}/code-mortis

jobs:
  verify:
    strategy:
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release tag
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git merge-base --is-ancestor HEAD origin/main
      - &docker-login
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build candidate image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,scope=release-${{ matrix.arch }},mode=max
      - name: Smoke test the candidate
        env:
          CANDIDATE: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          for check in mortis_container_smoke security_scanner_smoke code_graph_container; do
            docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
              --tmpfs /tmp:mode=1777,size=512m "$CANDIDATE" python "tests/$check.py"
          done
          printf '%s\n' "${CANDIDATE##*@}" > "$RUNNER_TEMP/digest"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-${{ matrix.arch }}
          path: ${{ runner.temp }}/digest
          if-no-files-found: error
          overwrite: true

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: verified-*
          path: ${{ runner.temp }}/digests
      - *docker-login
      - name: Publish versioned manifest and prepare Compose files
        shell: bash
        run: |
          export RELEASE_IMAGE="$IMAGE:${GITHUB_REF_NAME#v}"
          amd64=$(cat "$RUNNER_TEMP/digests/verified-amd64/digest")
          arm64=$(cat "$RUNNER_TEMP/digests/verified-arm64/digest")
          sources=("$IMAGE@$amd64" "$IMAGE@$arm64")
          if existing=$(docker buildx imagetools inspect --raw "$RELEASE_IMAGE" 2>/dev/null); then
            expected=$(docker buildx imagetools create --dry-run --tag "$RELEASE_IMAGE" "${sources[@]}")
            if [[ $(jq -cS . <<< "$existing") != $(jq -cS . <<< "$expected") ]]; then
              echo "Release tag $RELEASE_IMAGE already exists with different content." >&2
              exit 1
            fi
          else
            docker buildx imagetools create --tag "$RELEASE_IMAGE" "${sources[@]}"
          fi
          mkdir -p "$RUNNER_TEMP/release"
          yq 'del(."x-app".build) | ."x-app".image = strenv(RELEASE_IMAGE)' compose.yaml > "$RUNNER_TEMP/release/compose.yaml"
          cp backend/code_mortis/manage.py "$RUNNER_TEMP/release/manage.py"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: code-mortis-${{ github.ref_name }}-compose
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          overwrite: true
