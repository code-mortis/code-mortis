services:
  api:
    image: &coolify-app codemortis/code-mortis:0.1.0
    # Compose 5.1.3 needs the build reset on each service.
    build: !reset null
    ports: !reset []
    labels:
      - traefik.enable=true
      - traefik.docker.network=${COOLIFY_RESOURCE_UUID}
      - traefik.http.routers.code-mortis.rule=Host(`${CM_PUBLIC_HOST}`)
      - traefik.http.routers.code-mortis.entrypoints=https
      - traefik.http.routers.code-mortis.tls=true
      - traefik.http.routers.code-mortis.tls.certresolver=letsencrypt
      - traefik.http.routers.code-mortis.service=code-mortis
      - traefik.http.services.code-mortis.loadbalancer.server.port=8080
  migrate:
    image: *coolify-app
    build: !reset null
  review-worker:
    image: *coolify-app
    build: !reset null
  security-worker:
    image: *coolify-app
    build: !reset null
  verification-worker:
    image: *coolify-app
    build: !reset null
  summary-worker:
    image: *coolify-app
    build: !reset null
  sync-worker:
    image: *coolify-app
    build: !reset null
  scheduler:
    image: *coolify-app
    build: !reset null

networks:
  default:
    name: ${COOLIFY_RESOURCE_UUID}
    external: true
