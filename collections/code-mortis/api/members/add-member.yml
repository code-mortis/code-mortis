name: Add Member
method: POST
url: $base_url/api/v1/members
timeout: 30000
tags:
  - write
followRedirects: false
maxRedirects: 5
headers:
  Content-Type: application/json
body: |-
  {
    "login": "$member_login",
    "role": "member"
  }
body_type: json
assert:
  - expression: status
    operator: equals
    value: 200
