name: code-mortis-tests
services:
  postgres:
    image: postgres:17-alpine
    environment: {POSTGRES_USER: mortis, POSTGRES_PASSWORD: mortis-test-only, POSTGRES_DB: mortis_test}
    ports: ["127.0.0.1:55439:5432"]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U mortis -d mortis_test"]
      interval: 2s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:56389:6379"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      retries: 20
