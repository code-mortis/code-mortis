[project]
name = "code-mortis"
version = "0.1.0"
description = "Self-hosted GitHub pull request reviews with Open Code Review"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.15,<2",
  "celery[redis]>=5.6,<6",
  "httpx>=0.28,<1",
  "cryptography>=44",
  "pyjwt[crypto]>=2.10,<3",
  "authlib>=1.6,<2",
  "sentry-sdk[celery]>=2.72,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
