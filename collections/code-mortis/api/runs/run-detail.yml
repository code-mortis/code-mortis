name: Run Detail
method: GET
url: $base_url/api/v1/runs/:run_id
timeout: 30000
tags:
  - read
followRedirects: false
maxRedirects: 5
params:
  - name: ordering
    value: -severity
    enabled: false
path_params:
  - name: run_id
    value: $run_id
body_type: none
assert:
  - expression: status
    operator: equals
    value: 200
auth:
  type: inherit
