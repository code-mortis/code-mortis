name: Delete Connection
method: DELETE
url: $base_url/api/v1/connections/:connection_id
timeout: 30000
tags:
  - write
followRedirects: false
maxRedirects: 5
path_params:
  - name: connection_id
    value: $connection_id
body_type: none
assert:
  - expression: status
    operator: equals
    value: 200
