name: Grant
method: PUT
url: $base_url/api/v1/connections/:identity/grants/:repository_id
timeout: 30000
tags:
  - write
followRedirects: false
maxRedirects: 5
headers:
  Content-Type: application/json
path_params:
  - name: identity
    value: $connection_id
  - name: repository_id
    value: $repository_id
body: |-
  {
    "automatic": false
  }
body_type: json
assert:
  - expression: status
    operator: equals
    value: 200
