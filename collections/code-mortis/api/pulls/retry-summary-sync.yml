name: Retry Summary Sync
method: POST
url: $base_url/api/v1/pulls/:pr_id/summary
timeout: 30000
tags:
  - write
followRedirects: false
maxRedirects: 5
path_params:
  - name: pr_id
    value: $pr_id
body_type: none
assert:
  - expression: status
    operator: equals
    value: 202
auth:
  type: inherit
