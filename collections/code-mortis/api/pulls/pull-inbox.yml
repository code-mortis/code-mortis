name: Pull Inbox
method: GET
url: $base_url/api/v1/pulls
timeout: 30000
tags:
  - read
  - smoke
followRedirects: false
maxRedirects: 5
params:
  - name: visibility
    value: visible
    enabled: false
  - name: state
    value: open
    enabled: false
  - name: ordering
    value: -created_at
    enabled: false
  - name: page
    value: '1'
    enabled: false
body_type: none
assert:
  - expression: status
    operator: equals
    value: 200
auth:
  type: inherit
