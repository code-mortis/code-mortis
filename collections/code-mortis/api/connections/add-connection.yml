name: Add Connection
method: POST
url: $base_url/api/v1/connections
timeout: 30000
tags:
  - write
followRedirects: false
maxRedirects: 5
headers:
  Content-Type: application/json
body: |-
  {
    "kind": "api",
    "name": "$connection_name",
    "provider": "openai",
    "protocol": "openai-responses",
    "base_url": "$provider_base_url",
    "model": "$model",
    "api_key": "$provider_api_key"
  }
body_type: json
capture:
  connection_id:
    value: body.id
    persist: environment
assert:
  - expression: status
    operator: equals
    value: 201
