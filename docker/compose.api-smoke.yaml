name: code-mortis-api-smoke

x-app: &app
  image: code-mortis:test
  pull_policy: never
  env_file: ${CM_SMOKE_ENV_FILE:?Set the path to an environment generated by init-env}
  environment:
    CM_DATABASE_URL: postgresql+psycopg://mortis:${POSTGRES_PASSWORD:?Run init-env first}@postgres:5432/mortis
    CM_REDIS_URL: redis://redis:6379/0

services:
  postgres:
    image: mirror.gcr.io/library/postgres:17-alpine
    environment:
      POSTGRES_USER: mortis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run init-env first}
      POSTGRES_DB: mortis
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, mortis, -d, mortis]
      interval: 2s
      timeout: 3s
      retries: 20
  redis:
    image: mirror.gcr.io/library/redis:7-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 20
  migrate:
    <<: *app
    command: [alembic, upgrade, head]
    depends_on:
      postgres: {condition: service_healthy}
  api:
    <<: *app
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, --fail, --silent, --show-error, --max-time, "3", "http://127.0.0.1:8080/health/live"]
      interval: 2s
      timeout: 5s
      retries: 20
