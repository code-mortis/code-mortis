name: Update Finding
method: PATCH
url: $base_url/api/v1/findings/:finding_id
timeout: 30000
tags:
  - write
followRedirects: false
maxRedirects: 5
headers:
  Content-Type: application/json
path_params:
  - name: finding_id
    value: $finding_id
body: |-
  {
    "status": "open",
    "reason": "Reopened from Noodle"
  }
body_type: json
assert:
  - expression: status
    operator: equals
    value: 202
auth:
  type: inherit
