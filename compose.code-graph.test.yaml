name: code-mortis-code-graph-tests
services:
  code-graph-parser:
    extends: {file: compose.code-graph.yaml, service: code-graph-parser}
    restart: "no"
  unrelated-peer:
    image: code-mortis-code-graph:0.1.0
    networks: [default]
    entrypoint: [python, -c, "import socket,time; sockets=[socket.socket() for _ in range(2)]; [(sock.bind(('0.0.0.0',port)),sock.listen()) for sock,port in zip(sockets,[5432,6379])]; time.sleep(600)"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  probe:
    image: code-mortis-code-graph-checks:0.1.0
    build: {context: ., dockerfile: Dockerfile.code-graph, target: checks}
    environment:
      CM_CODE_GRAPH_TOKEN: ${CM_CODE_GRAPH_TOKEN:?Use a disposable test token}
      PYTHONPATH: /app/backend
    networks: [code-graph]
    entrypoint: [python, /checks/code_graph_container.py]
    volumes:
      - ./backend/tests/code_graph_container.py:/checks/code_graph_container.py:ro
      - ./scripts/code_graph_eval/fixtures.json:/checks/fixtures.json:ro
    read_only: true
    tmpfs: ["/tmp:mode=1777,size=16m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    profiles: [checks]
networks:
  code-graph:
    internal: true
