name: Scan Coverage
method: GET
url: $base_url/api/v1/security/scans/:scan_id/coverage/:section
timeout: 30000
tags:
  - read
followRedirects: false
maxRedirects: 5
params:
  - name: page
    value: '1'
    enabled: false
path_params:
  - name: scan_id
    value: $scan_id
  - name: section
    value: $section
body_type: none
assert:
  - expression: status
    operator: equals
    value: 200
auth:
  type: inherit
