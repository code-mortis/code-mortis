name: Consent
method: POST
url: $base_url/api/v1/mcp/authorize
timeout: 30000
tags:
  - write
followRedirects: false
maxRedirects: 5
headers:
  Content-Type: application/json
body: |-
  {
    "request_id": "$request_id",
    "repository_ids": [],
    "scopes": [
      "reviews:read"
    ],
    "approve": false
  }
body_type: json
assert:
  - expression: status
    operator: equals
    value: 200
