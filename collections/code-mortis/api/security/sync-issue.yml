name: Sync Issue
method: POST
url: $base_url/api/v1/security/findings/:finding_id/github-issue/sync
timeout: 30000
tags:
  - write
followRedirects: false
maxRedirects: 5
path_params:
  - name: finding_id
    value: $security_finding_id
body_type: none
assert:
  - expression: status
    operator: equals
    value: 202
