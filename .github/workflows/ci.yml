name: Verify
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  export-openapi:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with: { version: '0.9.14' }
      - run: uv sync --frozen --python 3.13
      - run: uv run python -m code_mortis.manage export-openapi --output ../openapi.json
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: openapi.json
          if-no-files-found: error
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:17-alpine
        env: { POSTGRES_USER: mortis, POSTGRES_PASSWORD: mortis-test-only, POSTGRES_DB: mortis_test }
        ports: [55439:5432]
        options: --health-cmd "pg_isready -U mortis -d mortis_test" --health-interval 5s --health-retries 10
      redis:
        image: mirror.gcr.io/library/redis:7-alpine
        ports: [56389:6379]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with: { version: '0.9.14' }
      - run: uv sync --frozen --python 3.13
      - run: uv run ruff check .
      - run: uv run python -m pytest -q
  frontend:
    needs: export-openapi
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: '1.4.2' }
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: openapi
          path: .
      - run: bunx openapi-typescript ../openapi.json -o src/api.generated.ts
      - run: git diff --exit-code -- src/api.generated.ts
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - run: bun run test
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg DOCKERHUB_REGISTRY=mirror.gcr.io -t code-mortis:test .
      - run: >-
          docker run --rm --network none --read-only
          --tmpfs /tmp:mode=1777,size=256m
          --tmpfs /home/mortis/.opencodereview:uid=10001,gid=10001,mode=0700,size=32m
          code-mortis:test python tests/ocr_container_smoke.py
  native-clients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg DOCKERHUB_REGISTRY=mirror.gcr.io -f Dockerfile.runner -t code-mortis-runner:test .
      - run: >-
          docker run --rm --network none --read-only
          --tmpfs /tmp:mode=1777,size=256m
          --tmpfs /profiles:uid=10001,gid=10001,mode=0700,size=64m
          --tmpfs /home/mortis:uid=10001,gid=10001,mode=0700,size=64m
          code-mortis-runner:test python -m tests.native_runner_smoke
