name: Verify frontend
# shortcut: GitHub filters inspect at most 3,000 files; dispatch manually for larger diffs.
on:
  push:
    branches: [main]
    paths: &paths
      - '.github/workflows/ci.yml'
      - '.github/ci-filters.test.ts'
      - 'frontend/**'
      # Public routes, schemas and FastAPI dependencies determine the browser contract.
      - 'backend/code_mortis/__init__.py'
      - 'backend/code_mortis/main.py'
      - 'backend/code_mortis/manage.py'
      - 'backend/code_mortis/api/**'
      - 'backend/code_mortis/core/__init__.py'
      - 'backend/code_mortis/integrations/__init__.py'
      - 'backend/code_mortis/reviews/__init__.py'
      - 'backend/code_mortis/security_scans/__init__.py'
      - 'backend/code_mortis/mcp/__init__.py'
      - 'backend/code_mortis/mcp/auth.py'
      - 'backend/code_mortis/mcp/server.py'
      - 'backend/code_mortis/schemas/**'
      - 'backend/code_mortis/core/ordering.py'
      - 'backend/code_mortis/core/db.py'
      - 'backend/pyproject.toml'
      - 'backend/uv.lock'
  pull_request:
    branches: [main]
    paths: *paths
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  export-openapi:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with: { version: '0.9.14' }
      - run: uv sync --frozen --python 3.13
      - run: uv run python -m code_mortis.manage export-openapi --output ../openapi.json
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: openapi.json
          if-no-files-found: error
  frontend:
    needs: export-openapi
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: '1.4.2' }
      - run: bun install --frozen-lockfile
      - run: bun test ../.github/ci-filters.test.ts
      - uses: actions/download-artifact@v4
        with:
          name: openapi
          path: .
      - run: bunx openapi-typescript ../openapi.json -o src/api.generated.ts
      - run: git diff --exit-code -- src/api.generated.ts
      - run: bun run build
      - if: github.event_name == 'workflow_dispatch'
        run: bunx playwright install --with-deps chromium
      - if: github.event_name == 'workflow_dispatch'
        run: bun run test
