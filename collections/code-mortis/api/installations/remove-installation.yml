name: Remove Installation
method: DELETE
url: $base_url/api/v1/installations/:installation_id/local
timeout: 30000
tags:
  - write
followRedirects: false
maxRedirects: 5
path_params:
  - name: installation_id
    value: $installation_id
body_type: none
assert:
  - expression: status
    operator: equals
    value: 200
