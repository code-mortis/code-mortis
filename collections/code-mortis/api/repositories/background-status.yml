name: Background Status
method: GET
url: $base_url/api/v1/repositories/:repository_id/background/:job_id
timeout: 30000
tags:
  - read
followRedirects: false
maxRedirects: 5
path_params:
  - name: repository_id
    value: $repository_id
  - name: job_id
    value: $job_id
body_type: none
assert:
  - expression: status
    operator: equals
    value: 200
